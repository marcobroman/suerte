appId: com.onda.app
productName: Onda
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  category: public.app-category.music
  # arm64 covers Apple Silicon, x64 covers older Intel Macs.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
