name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# macOS installers can only be produced on macOS hardware, so each OS builds
# its own artifacts here. Builds are unsigned (no certificates in CI): macOS
# users open the app once via right-click → Open.
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: onda-windows
          path: release/*.exe

  macos:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: onda-macos
          path: |
            release/*.dmg
            release/*.zip
